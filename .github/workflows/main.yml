name: Build TrueThroughScope

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
  COMMONLIBF4_REF: 67173f8d44b9a928dbab983d25e576ac5f1e83ac

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout True-Through-Scope (this repo)
        uses: actions/checkout@v4
        with:
          path: src/True-Through-Scope

      - name: Checkout CommonLibF4 (pinned version)
        uses: actions/checkout@v4
        with:
          repository: Ryan-rsm-McKenzie/CommonLibF4
          ref: ${{ env.COMMONLIBF4_REF }}
          path: src/CommonLibF4
          clean: false

      - name: Checkout ImGui (docking, required sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          ref: v1.92.9b-docking
          path: src/imgui
          clean: false

      - name: Fetch F4SE SDK headers (official, required by PCH.h)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://f4se.silverlock.org/beta/f4se_0_06_23.7z' `
            -OutFile 'f4se.7z' -UserAgent 'Mozilla/5.0'
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z' }
          & $sevenZip x 'f4se.7z' -o'f4se-sdk' -y | Out-Null
          Write-Host '--- f4se-sdk/src 顶层 ---'
          Get-ChildItem 'f4se-sdk/src' | Select-Object Name
          Copy-Item 'f4se-sdk/src/*' 'src/True-Through-Scope/include/' -Recurse -Force
          Write-Host '--- 确认关键头文件已就位 ---'
          Get-ChildItem 'src/True-Through-Scope/include' | Select-Object Name
          if (-not (Test-Path 'src/True-Through-Scope/include/f4se/F4SE.hpp')) {
            Write-Error 'F4SE.hpp 未找到，SDK 结构不符合预期'
          }

      - name: Setup vcpkg (use runner-preinstalled copy)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          Push-Location $env:VCPKG_INSTALLATION_ROOT
          ./bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg --version
          Pop-Location

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('src/True-Through-Scope/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S src/True-Through-Scope -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCOPY_BUILD=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: List built binaries
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Include *.dll |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload DLL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueThroughScope-fixed
          path: build/**/TrueThroughScope.dll
          if-no-files-found: error
