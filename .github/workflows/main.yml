name: Build TrueThroughScope

# ---------------------------------------------------------------------------
# This workflow is only an ENTRY POINT.
#
# All compatibility patches and the CMake/Ninja build live in
#     ci/build.ps1        (logic)
#     ci/PCH.append.h     (C++ shim appended to PCH.h)
#
# Editing those two files is enough for almost any future change -- this YAML
# rarely needs to be touched.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
  # TTS needs F4SE::PluginVersionData / AuthorName / CompatibleVersions, which
  # upstream Ryan-rsm-McKenzie/CommonLibF4 and libxse/commonlibf4 both lack.
  # powerof3/CommonLibF4 is the closest public match (the Upscaling project
  # doodlum/fo4test points at it via .gitmodules).
  COMMONLIBF4_REF: master

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Unique marker: if this never appears in the log, the workflow file you
      # are looking at is NOT the one that ran.
      - name: Workflow revision marker
        shell: pwsh
        run: |
          Write-Host '=================================================='
          Write-Host 'TTS_WORKFLOW_MARKER_CI_SCRIPT_02'
          Write-Host '=================================================='
          Write-Host "workflow_ref : ${{ github.workflow_ref }}"
          Write-Host "sha          : ${{ github.sha }}"
          Write-Host "ref_name     : ${{ github.ref_name }}"
          Write-Host "run_id       : ${{ github.run_id }}"

      - name: Checkout True-Through-Scope (this repo)
        uses: actions/checkout@v4
        with:
          path: src/True-Through-Scope

      - name: Checkout CommonLibF4 (powerof3 fork, required API)
        uses: actions/checkout@v4
        with:
          repository: powerof3/CommonLibF4
          ref: ${{ env.COMMONLIBF4_REF }}
          path: src/CommonLibF4
          clean: false

      # CMakeLists.txt hard-errors when ../imgui is absent; TTS defines
      # IMGUI_ENABLE_DOCKING, so the docking branch is required.
      - name: Checkout ImGui (docking, required sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          ref: v1.92.9b-docking
          path: src/imgui
          clean: false

      - name: Show checked-out revision
        shell: pwsh
        run: |
          git -C src/True-Through-Scope log -1 --format='TTS commit: %H  %s  (%ci)'
          Write-Host 'ci/ contents:'
          Get-ChildItem 'src/True-Through-Scope/ci' -ErrorAction SilentlyContinue |
            ForEach-Object { '  ' + $_.Name + '  (' + $_.Length + ' bytes)' }

      - name: Setup vcpkg (use runner-preinstalled copy)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          Push-Location $env:VCPKG_INSTALLATION_ROOT
          ./bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg --version
          Pop-Location

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('src/True-Through-Scope/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Everything else (patches, verification, CMake configure, Ninja build)
      # happens inside this script.
      - name: Build via ci/build.ps1
        shell: pwsh
        run: pwsh -NoProfile -File src/True-Through-Scope/ci/build.ps1

      - name: Upload DLL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueThroughScope-fixed
          path: build/**/TrueThroughScope.dll
          if-no-files-found: error

      # Even when the build fails, keep the patched sources for inspection.
      - name: Upload patched sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patched-sources
          path: |
            src/True-Through-Scope/src/PCH.h
          if-no-files-found: ignore
